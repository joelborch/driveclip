<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DriveClip — Microphone access</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; padding: 64px 20px; background: #F7F7F8; color: #1B1D21; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; justify-content: center; }
    main { width: 100%; max-width: 440px; background: #fff; border: 1px solid #E4E5E9; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    h1 { margin: 0; font-size: 20px; }
    p { margin: 0; color: #5B606A; }
    button { padding: 10px 12px; border: 1px solid #D6D8DD; border-radius: 8px; background: #fff; color: #1B1D21; font: 500 14px/1.2 inherit; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    .note { padding: 12px; border-radius: 8px; border: 1px solid #E4E5E9; display: flex; flex-direction: column; gap: 8px; }
    .ok { background: #EDF8F0; border-color: #C9E8D1; color: #1E5631; }
    .bad { background: #FDF0F0; border-color: #F3D2D3; color: #8B1E24; }
    input { width: 100%; padding: 8px; border: 1px solid #D6D8DD; border-radius: 6px; font: 12px ui-monospace, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Allow microphone access</h1>
    <p>DriveClip records in a background document that can't show permission prompts, so allow the mic once here. Nothing is recorded on this page.</p>
    <button id="btn-request">Allow microphone</button>
    <div class="note ok" id="note-granted" hidden><strong>Microphone enabled.</strong> Close this tab and start recording.</div>
    <div class="note bad" id="note-denied" hidden>
      <strong id="denied-title">Microphone blocked.</strong>
      <p id="denied-message"></p>
      <button id="btn-settings">Open site settings</button>
      <input type="text" id="settings-url" readonly aria-label="Site settings URL">
    </div>
  </main>
  <script src="mic.js" type="module"></script>
</body>
</html>
